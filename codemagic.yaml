workflows:
  kmp-workflow:
    name: KMP Build & Test Lab
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      groups:
        - FIREBASE_DAILYPULSE
      xcode: latest
      java: 17
    scripts:
      - name: Set up Service Account
        script: |
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Error: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is empty. Verify if the group name in YAML matches the Codemagic UI."
            exit 1
          fi
          # Using -D for macOS base64 compatibility
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" | base64 -D > ./gcloud_key.json
      - name: Android / JVM unit tests
        script: |
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest
        test_report: "**/build/test-results/**/*.xml"
      - name: Build Android (mpp debug + androidTest)
        script: |
          chmod +x gradlew
          # Debug APKs live under androidApp/build/outputs/apk/<flavor>/debug/ (see README).
          ./gradlew :androidApp:assembleMppDebug :androidApp:assembleMppDebugAndroidTest
      - name: iOS unit and integration tests (Simulator)
        script: |
          set -e
          chmod +x gradlew

          # Compose 1.11+ wires syncComposeResourcesForIos.outputDir from Xcode's
          # BUILT_PRODUCTS_DIR + UNLOCALIZED_RESOURCES_FOLDER_PATH. Gradle 9 fails
          # the task if those are missing. embedAndSignAppleFrameworkForXcode is
          # therefore only safe from Xcode's script phase (see project.pbxproj),
          # not from a standalone ./gradlew call.
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

          brew install chargepoint/xcparse/xcparse

          cd iosApp
          xcodebuild clean test \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
          cd ..

          # Codemagic's Tests tab consumes JUnit XML, not .xcresult.
          mkdir -p iosApp/test-reports
          xcode-project junit-test-results \
            --xcresult iosApp/TestResults.xcresult \
            --output-dir iosApp/test-reports
        test_report: iosApp/test-reports/*.xml
      - name: Extract Media from XCUITest
        script: |
          # 5. Create a directory for media attachments
          mkdir -p iosApp/TestMedia
          
          # 6. Extract Screenshots and Videos
          # The 'screenshots' command automatically extracts all media attachments from the bundle
          xcparse screenshots iosApp/TestResults.xcresult iosApp/TestMedia
          
          # 7. DEBUG: List the extracted files (This will appear in your build logs)
          echo "--- Content of TestMedia folder ---"
          ls -R iosApp/TestMedia
          
          # 8. DEBUG: Verify if the .xcresult bundle exists
          echo "--- Checking if .xcresult bundle exists ---"
          ls -d iosApp/TestResults.xcresult

      - name: Run Tests on Firebase Test Lab (Android)
        script: |
          set -e
          gcloud auth activate-service-account --key-file=./gcloud_key.json
          gcloud --quiet config set project dailypulse-kmp

          mkdir -p build/ftl-results
          FTL_RESULTS_DIR="dailypulse-${CM_BUILD_ID:-local}-$(date +%s)"
          FTL_LOG="build/ftl-results/gcloud.log"

          set +e
          if [ -n "$FTL_RESULTS_BUCKET" ]; then
            gcloud firebase test android run \
              --type instrumentation \
              --app androidApp/build/outputs/apk/mpp/debug/androidApp-mpp-debug.apk \
              --test androidApp/build/outputs/apk/androidTest/mpp/debug/androidApp-mpp-debug-androidTest.apk \
              --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
              --record-video \
              --results-bucket "$FTL_RESULTS_BUCKET" \
              --results-dir "$FTL_RESULTS_DIR" \
              > "$FTL_LOG" 2>&1
          else
            gcloud firebase test android run \
              --type instrumentation \
              --app androidApp/build/outputs/apk/mpp/debug/androidApp-mpp-debug.apk \
              --test androidApp/build/outputs/apk/androidTest/mpp/debug/androidApp-mpp-debug-androidTest.apk \
              --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
              --record-video \
              --results-dir "$FTL_RESULTS_DIR" \
              > "$FTL_LOG" 2>&1
          fi
          FTL_EXIT=$?
          set -e
          cat "$FTL_LOG"

          GCS_URI="$(grep -Eo 'gs://[^][:space:]]+' "$FTL_LOG" | head -1 || true)"
          if [ -z "$GCS_URI" ]; then
            BROWSER_PATH="$(grep -Eo 'storage/browser/[^]]+' "$FTL_LOG" | head -1 || true)"
            if [ -n "$BROWSER_PATH" ]; then
              GCS_URI="gs://${BROWSER_PATH#storage/browser/}"
            elif [ -n "$FTL_RESULTS_BUCKET" ]; then
              GCS_URI="gs://${FTL_RESULTS_BUCKET#gs://}/${FTL_RESULTS_DIR}"
            fi
          fi

          echo "FTL GCS URI: ${GCS_URI:-<not found>}"
          if [ -n "$GCS_URI" ]; then
            # Screenshots, logcat, videos, and JUnit XML from the FTL device run.
            gsutil -m cp -r "$GCS_URI" build/ftl-results/ || \
              gcloud storage cp --recursive "$GCS_URI" build/ftl-results/
          else
            echo "Warning: could not resolve FTL Cloud Storage path; skipping download."
          fi

          echo "--- Content of build/ftl-results ---"
          ls -R build/ftl-results || true

          exit "$FTL_EXIT"
        test_report: "build/ftl-results/**/*.xml"

    artifacts:
      - iosApp/TestMedia/**/*        # Allows viewing images/videos directly in the Codemagic UI
      - iosApp/TestResults.xcresult  # Logs, screenshots and hierarchy of XCUITest
      - iosApp/test-reports/**       # JUnit XML converted from .xcresult
      - shared/build/reports/**      # HTML/XML of JVM unit tests
      - androidApp/build/reports/**  # Android build and test reports
      - build/ftl-results/**         # Firebase Test Lab recordings, logcat, JUnit
      - androidApp/build/outputs/apk/**/*.apk
