[versions]
agp = "8.13.2"
coilCompose = "2.7.0"
kotlin = "2.4.10"
# androidx compose 1.12 and lifecycle 2.11 require AGP 9.1 and compileSdk 37, so this
# project stays one generation back while it is on the AGP 8 line.
compose = "1.11.0"
compose-material3 = "1.4.0"
androidx-activityCompose = "1.13.0"
kotlinxCoroutinesCore = "1.11.0"
lifecycleViewmodelKtx = "2.10.0"
navigationCompose = "2.9.8"
ktorClient = "3.5.2"
kotlinxDatetime = "0.8.0"
koin = "4.2.2"
sqlDelight = "2.3.2"
composeMultiplatform = "1.11.1"
kamelImage = "1.0.9"
voyagerVersion = "2.2.21-1.10.3"
# Material Icons are end-of-life: Google stopped publishing them and removed them from
# material3. JetBrains pins the multiplatform artifact at 1.7.3. Kept to avoid redesigning
# the toolbars; the forward path is Material Symbols vector drawables.
materialIconsMultiplatform = "1.7.3"
materialIconsAndroid = "1.7.8"
androidx-test-junit = "1.1.5"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"


[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
# Old Android Material (pullrefresh); alias avoids libs.androidx.compose.* accessors that confuse the IDE
# with the JetBrains compose plugin DSL.
material-compose-android = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClient" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorClient" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorClient" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClient" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktorClient" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }

voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyagerVersion" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyagerVersion" }

sql-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqlDelight" }
sql-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqlDelight" }
sql-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqlDelight" }

compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "composeMultiplatform" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsMultiplatform" }
material-icons-core-android = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsAndroid" }

kamel-image = { module = "media.kamel:kamel-image-default", version.ref = "kamelImage" }



[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships as a Kotlin plugin and must match the Kotlin version.
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sqlDelight" }

composeMultiplatformPlugin = { id= "org.jetbrains.compose", version.ref = "composeMultiplatform" }
